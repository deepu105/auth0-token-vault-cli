name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Verify tag points to main history
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"
      - run: npm run release:check
      - name: Publish to npm with Trusted Publishing
        run: npm run release:publish
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --generate-notes

  # Publishes the Agent Skill at skills/auth0-token-vault to ClawHub.
  # Version is read from SKILL.md frontmatter (not the npm tag), so bumping
  # the skill is independent of npm patches. If SKILL.md hasn't changed
  # since the last release, clawhub will reject the duplicate and this job
  # fails — that's expected; the npm release already succeeded.
  publish-skill:
    needs: publish
    uses: openclaw/clawhub/.github/workflows/package-publish.yml@v0.1.0
    with:
      source_path: skills/auth0-token-vault
      tags: latest
      dry_run: false
    secrets:
      clawhub_token: ${{ secrets.CLAWHUB_TOKEN }}
