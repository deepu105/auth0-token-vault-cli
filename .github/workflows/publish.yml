name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Verify tag points to main history
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"
      - run: npm run release:check
      - name: Publish to npm with Trusted Publishing
        run: npm run release:publish
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --generate-notes

  # ClawHub publish is temporarily disabled.
  #
  # This repo is structurally a Claude plugin marketplace (see
  # .claude-plugin/marketplace.json) that bundles the skill at
  # ./skills/auth0-token-vault. ClawHub's `package publish` in v0.15.0
  # only recognises `code-plugin` and `bundle-plugin` families — there's
  # no `skill` family and no `--family` input on the reusable workflow,
  # so pointing `source_path` at the skill dir fails with
  # "Could not detect package family."
  #
  # Options when reintroducing:
  #   - Publish the repo root as a bundle-plugin (drop source_path; clawhub
  #     detects via the skills/ directory marker).
  #   - Wait for upstream to add skill-family / --family support.
  #
  # publish-skill:
  #   needs: publish
  #   uses: openclaw/clawhub/.github/workflows/package-publish.yml@v0.15.0
  #   with:
  #     tags: latest
  #     dry_run: false
  #   secrets:
  #     clawhub_token: ${{ secrets.CLAWHUB_TOKEN }}
